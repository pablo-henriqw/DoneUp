<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estatísticas | DoneUp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="../js/script.js" defer></script>
    <script src="../js/tarefas.js" defer></script>
    <script src="../js/estatisticas.js" defer></script>
</head>
<body data-pagina="estatisticas" data-titulo="Estatísticas" data-raiz="../">
<main>
    <section class="grade larga">
        <div class="painel">
            <h2>Tarefas concluídas</h2>
            <strong id="porcentagem">–</strong>
            <div class="barra"><div id="barra"></div></div>
        </div>
        <div class="painel">
            <h2>Tarefas por status</h2>
            <div class="grafico"><canvas id="grafico-status"></canvas></div>
        </div>
        <div class="painel">
            <h2>Tarefas por prioridade</h2>
            <div class="grafico"><canvas id="grafico-prioridade"></canvas></div>
        </div>
        <div class="painel">
            <h2>Tarefas por categoria</h2>
            <div class="grafico"><canvas id="grafico-categoria"></canvas></div>
        </div>
    </section>
</main>
</body>
</html>
