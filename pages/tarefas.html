<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minhas tarefas | DoneUp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
    <script src="../js/script.js" defer></script>
    <script src="../js/tarefas.js" defer></script>
</head>
<body data-pagina="tarefas" data-titulo="Minhas tarefas" data-raiz="../">
<main>
    <section class="painel">
        <div class="linha filtros">
            <label>Status <select id="filtro-status"></select></label>
            <label>Prioridade <select id="filtro-prioridade"></select></label>
            <label>Categoria <select id="filtro-categoria"></select></label>
            <label>Vencimento <input type="date" id="filtro-data"></label>
            <button type="button" class="botao secundario" id="limpar">Limpar filtros</button>
        </div>
    </section>

    <p class="suave" id="contagem"></p>
    <section id="lista"></section>

    <section class="painel">
        <h2>Categorias</h2>
        <div id="lista-categorias"></div>
        <form class="linha" id="form-categoria">
            <input id="categoria-nome" maxlength="50" placeholder="Nome da nova categoria" aria-label="Nome da nova categoria" required>
            <button class="botao">Adicionar</button>
        </form>
    </section>
</main>
</body>
</html>
