<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quadro Kanban | DoneUp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
    <script src="../js/script.js" defer></script>
    <script src="../js/tarefas.js" defer></script>
    <script src="../js/kanban.js" defer></script>
</head>
<body data-pagina="kanban" data-titulo="Quadro Kanban" data-raiz="../">
<main>
    <p class="suave">Use o seletor de cada cartão para mover a tarefa de coluna. Clique no cartão para editar.</p>
    <section class="quadro" id="quadro">
        <div class="painel coluna pendente">
            <h2><i class="ponto"></i>Pendente<span id="contador-pendente">–</span></h2>
            <div id="coluna-pendente"></div>
        </div>
        <div class="painel coluna em_andamento">
            <h2><i class="ponto"></i>Em andamento<span id="contador-em_andamento">–</span></h2>
            <div id="coluna-em_andamento"></div>
        </div>
        <div class="painel coluna concluida">
            <h2><i class="ponto"></i>Concluído<span id="contador-concluida">–</span></h2>
            <div id="coluna-concluida"></div>
        </div>
    </section>
</main>
</body>
</html>
