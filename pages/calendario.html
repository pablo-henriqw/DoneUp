<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendário | DoneUp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
    <script src="../js/script.js" defer></script>
    <script src="../js/tarefas.js" defer></script>
    <script src="../js/calendario.js" defer></script>
</head>
<body data-pagina="calendario" data-titulo="Calendário" data-raiz="../">
<main>
    <div class="calendario">
        <section class="painel">
            <div class="cal-topo">
                <h2 id="titulo-mes"></h2>
                <button type="button" class="botao secundario" id="hoje">Hoje</button>
                <button type="button" class="mini" id="anterior" aria-label="Mês anterior">&lt;</button>
                <button type="button" class="mini" id="proximo" aria-label="Próximo mês">&gt;</button>
            </div>
            <div class="semana"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div>
            <div class="dias" id="dias"></div>
            <div class="legenda">
                <span><i class="ponto em_andamento"></i> Em aberto</span>
                <span><i class="ponto atrasada"></i> Atrasada</span>
                <span><i class="ponto concluida"></i> Concluída</span>
            </div>
        </section>
        <aside class="painel">
            <h2 id="titulo-dia"></h2>
            <div id="tarefas-dia"></div>
        </aside>
    </div>
</main>
</body>
</html>
